<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1ba572">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TD Home">
<title>TD Home</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f7fbf9;--text:#1b2b25;--muted:#8ba398;--card:#fff;--line:#e6efea;--dot:#1ba572;
    --btn:#1ba572;--btntext:#fff;--glance:#e7f6ef;--glanceb:#149a66;--chipbg:#eef3f0;--chipfg:#6d8579;
    --shadow:0 2px 8px rgba(30,70,50,.05);--radius:16px;
    --miss:#fdf3e6;--missf:#b26a12}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC",sans-serif}
  #app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:150px;position:relative}
  .head{padding:22px 20px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .head.dom{color:#fff;border:0}
  .hi{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .date{font-size:12.5px;color:var(--muted);margin-top:3px}
  .head.dom .date{color:rgba(255,255,255,.85)}
  .back{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;display:inline-block}
  .head.dom .back{color:rgba(255,255,255,.9)}
  .glance{margin-top:13px;font-size:12.5px;background:var(--glance);color:var(--glanceb);border-radius:14px;padding:11px 13px;line-height:1.55}
  .glance b{font-weight:800}
  main{padding:14px 15px 0}
  .sec{font-size:12px;font-weight:800;color:var(--muted);margin:16px 3px 9px;display:flex;align-items:center;gap:6px}
  .sec .r{margin-left:auto;font-weight:700;color:var(--dot)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;margin-bottom:10px}
  .item{display:flex;align-items:center;gap:12px}
  .item .tm{font-size:12px;font-weight:800;width:46px;flex:none;font-variant-numeric:tabular-nums;color:var(--text)}
  .item .tm.none{color:var(--muted);font-weight:600}
  .item .tm.hi{color:var(--dot)}
  .item .bd{flex:1;min-width:0}
  .ttl{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .ttl.done{text-decoration:line-through;color:var(--muted)}
  .meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chipbg);color:var(--chipfg)}
  .do{flex:none;font-size:12.5px;font-weight:700;border:0;border-radius:11px;padding:9px 15px;background:var(--btn);color:var(--btntext);box-shadow:0 4px 12px rgba(27,165,114,.24)}
  .do.ghost{background:var(--chipbg);color:var(--muted);box-shadow:none}
  .do.mut{background:#f3f5f4;color:#a3b3ab;box-shadow:none}
  .box{background:#eef8f2;border:1px dashed #bfe6d2;border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;gap:11px}
  .box .ic{font-size:20px}.box .t{flex:1}.box .t b{font-size:13.5px}.box .t div{font-size:11.5px;color:var(--muted);margin-top:2px}
  .box .n{font-size:12px;font-weight:800;color:var(--dot)}
  .near{background:#ecf7f1;border-left:3px solid var(--dot);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:12.5px;line-height:1.5}
  .near b{color:var(--dot)}
  .night{display:flex;align-items:center;gap:10px;background:#e7f6ee;color:#255f45;border-radius:var(--radius);padding:14px 15px;font-size:13px;font-weight:700;margin:4px 0 2px}
  .night .n{margin-left:auto;font-size:11px;opacity:.8}
  .acts{display:flex;gap:7px;margin-top:11px}
  .acts button{flex:1;border:0;border-radius:11px;padding:10px 4px;font-size:12.5px;font-weight:700;background:var(--chipbg);color:var(--muted)}
  .acts button.pri{background:var(--btn);color:var(--btntext)}
  .acts button.g{background:#eaf6f0;color:#2f8f6b}
  .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:16px 10px;line-height:1.6}
  /* folders */
  .folder{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
  .folder .fi{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;color:#fff}
  .folder .fn{flex:1}.folder .fn b{font-size:15px}.folder .fn div{font-size:11.5px;color:var(--muted);margin-top:3px}
  .folder .fc{font-size:12px;color:var(--muted);font-weight:700}
  /* detail */
  .drow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .drow:last-child{border-bottom:0}.drow .k{color:var(--muted);font-size:12px}.drow .v{font-weight:600;text-align:right}
  .bigt{font-size:19px;font-weight:800;margin:8px 0 2px}
  .fullbtn{width:100%;padding:14px;font-size:15px;font-weight:800;background:var(--btn);color:var(--btntext);border:0;border-radius:13px;box-shadow:0 4px 12px rgba(27,165,114,.24);margin-top:4px}
  .rec{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 13px;margin-bottom:7px}
  .rec .rk{font-size:13px;font-weight:600;flex:1}.rec .rv{font-size:11.5px;color:var(--muted)}.rec .rok{color:var(--dot);font-weight:800;font-size:12px}.rec .rmiss{color:var(--missf);font-weight:700;font-size:11.5px}
  /* milestones */
  .prog{height:8px;border-radius:5px;background:var(--chipbg);overflow:hidden;margin:10px 0 6px}.prog i{display:block;height:100%;background:var(--btn)}
  .progl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
  .ms{position:relative;padding:0 0 16px 24px;border-left:2px solid #e0ebe5;margin-left:7px}
  .ms:last-child{border-color:transparent}
  .ms .md{position:absolute;left:-8px;top:1px;width:15px;height:15px;border-radius:50%;background:var(--card);border:2px solid #c5d3cb}
  .ms.done .md,.ms.now .md{background:var(--dot);border-color:var(--dot)}
  .ms.now .md{box-shadow:0 0 0 4px var(--glance)}
  .ms .mn{font-size:14.5px;font-weight:700}.ms.todo .mn{color:var(--muted)}
  .ms .mm{font-size:11px;color:var(--muted);margin-top:3px}
  .hang{font-size:10px;background:#f5f8f7;border:1px solid #e2ece9;border-radius:8px;padding:1px 7px;color:#6a7688}
  /* knowledge */
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 13px;margin-bottom:9px}
  .kcard .kt{font-size:13.5px;font-weight:700}.kcard .kp{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .route{display:flex;gap:5px;margin-top:10px}
  .route b{flex:1;text-align:center;font-size:11px;font-weight:700;border-radius:9px;padding:7px 3px;background:var(--chipbg);color:var(--muted)}
  .route b.on{background:var(--btn);color:var(--btntext)}
  /* reflection */
  .refl{background:var(--card);border:1px solid var(--line);border-left:3px solid #a866a0;border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:9px}
  .refl .rt{font-size:13.5px;font-weight:700}.refl .rx{font-size:12px;color:var(--muted);margin:4px 0 8px;line-height:1.5}
  .refl.arch .rt{text-decoration:line-through;color:var(--muted)}
  /* compose / infobox */
  .compose{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 13px;margin-bottom:12px}
  .compose textarea{flex:1;border:0;font-size:14px;font-family:inherit;resize:none;background:none;color:var(--text);min-height:44px}
  .compose textarea:focus{outline:0}
  .mic{width:42px;height:42px;border-radius:50%;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .send{width:100%;padding:13px;font-size:14.5px;font-weight:800;background:var(--btn);color:#fff;border:0;border-radius:13px;margin-bottom:12px}
  .info{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:11px}
  .info .echo{background:var(--glance);color:var(--glanceb);padding:11px 14px;font-size:12.5px;font-weight:600}
  .info .ibody{padding:13px 14px}
  .rawp{font-size:10px;font-weight:700;color:var(--dot);background:#eef8f2;border:1px solid #cfe9db;border-radius:20px;padding:2px 9px;display:inline-block;margin-bottom:9px}
  .ilbl{font-size:11px;color:var(--muted);margin:10px 0 5px}
  .fields{display:flex;gap:6px;flex-wrap:wrap}
  .fields .f{background:var(--chipbg);color:var(--muted);border-radius:9px;padding:5px 10px;font-size:11.5px;font-weight:600}
  .fields .miss{background:var(--miss);color:var(--missf)}
  .bar{height:7px;border-radius:5px;background:var(--chipbg);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:5px}
  .verdict{font-size:11.5px;font-weight:600;margin-top:10px;padding:9px 11px;border-radius:11px;line-height:1.5}
  .verdict.hi{background:#eef7f2;color:#2f8f6b}.verdict.lo{background:var(--miss);color:var(--missf)}
  /* sheet */
  .mask{position:fixed;inset:0;background:rgba(20,40,30,.42);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .mask.show{display:flex}
  .sheet{width:100%;max-width:460px;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 30px;max-height:90vh;overflow:auto}
  .sheet h3{font-size:18px;margin-bottom:4px}.sheet .hint{font-size:12px;color:var(--muted);margin-bottom:14px}
  .field{margin-bottom:14px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:14px;font-family:inherit;background:#fbfdfc}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:64px;border:1px solid var(--line);background:#fbfdfc;border-radius:11px;padding:11px;font-size:13.5px;font-weight:600;color:var(--text)}
  .seg button.sel{background:var(--btn);color:#fff;border-color:var(--btn)}
  /* fab + nav */
  .fab{position:fixed;right:calc(50% - 230px + 16px);bottom:92px;width:56px;height:56px;border-radius:50%;background:var(--btn);color:#fff;border:0;font-size:26px;box-shadow:0 8px 22px rgba(27,165,114,.4);z-index:30}
  @media(max-width:476px){.fab{right:16px}}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 0 22px;z-index:20}
  nav div{flex:1;text-align:center;font-size:10px;color:var(--muted)}
  nav div.on{color:var(--dot);font-weight:700}
  nav .ic{font-size:19px;display:block;margin-bottom:3px}
  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#22302a;color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:12px;z-index:50;display:flex;gap:12px;align-items:center;opacity:0;transition:opacity .2s;max-width:90%;pointer-events:none}
  .toast.show{opacity:1;pointer-events:auto}.toast .u{color:#8fd6b4;font-weight:800;pointer-events:auto}
  /* iOS: 让 div 上的 onclick 能被手指点击（桌面默认就行，iOS 需要 cursor:pointer） */
  [onclick]{cursor:pointer;touch-action:manipulation}
</style></head>
<body><div id="app"></div>
<button class="fab" onclick="go('capture')">＋</button>
<div class="mask" id="mask" onclick="if(event.target.id=='mask')closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================ 元数据 ============================ */
var DOMAINS={
  fin:{name:'财务',icon:'💰',color:'#356fc0',sub:'对账 · 预算 · 税务 · 净资产'},
  home:{name:'家庭生活',icon:'🏠',color:'#268a63',sub:'房子 · 一猫一狗 · 碎事 · 旅行'},
  baby:{name:'宝宝',icon:'🍼',color:'#c04f83',sub:'孕育 → 育儿 · 喂养 · 产检'},
  grow:{name:'成长与规划',icon:'📈',color:'#7a52c9',sub:'学习 · 护肤 · 回国 · 事业'},
  jrnl:{name:'日记与反思',icon:'📓',color:'#8a4f83',sub:'日记 · 每日/周/月复盘'}
};
var BLK={checkin:{n:'③打卡',c:'#0f9d63',bg:'#e4f5ec'},cycle:{n:'③循环',c:'#0f9d63',bg:'#e4f5ec'},
  task:{n:'④任务',c:'#2f6bc4',bg:'#e7effe'},know:{n:'②知识',c:'#7a52c9',bg:'#f3ecfb'},
  plan:{n:'⑤计划',c:'#0e857a',bg:'#e0f3f0'},refl:{n:'⑥反思',c:'#8b5cf6',bg:'#f3ecfb'},
  event:{n:'日程',c:'#356fc0',bg:'#e7effe'},reminder:{n:'提醒',c:'#8792a4',bg:'#eef1f5'}};
function chip(d){var m=DOMAINS[d];return m?'<span class="chip" style="background:'+m.color+'18;color:'+m.color+'">'+m.name+'</span>':'';}
function bchip(k){var m=BLK[k];return m?'<span class="chip" style="background:'+m.bg+';color:'+m.c+'">'+m.n+'</span>':'';}

/* ============================ 数据层 ============================ */
var KEY='td.db.v1';
function seed(){return {
  facts:{me:'Tina',dueDate:'2026-10-10',members:['Tina','于棣','妈妈'],baby:'于摆摆'},
  routines:[
    {id:'r1',name:'数胎动',domain:'baby',icon:'👶',risk:'高',schedule:['20:00'],rotation:['Tina'],
     fields:[{key:'count',label:'数量',type:'num',unit:'次',def:10},{key:'dur',label:'时长',type:'num',unit:'分',def:30}],
     source:'知识「孕晚期数胎动」',handoff:'宝宝今天动得少一点，晚上这次多留意。',records:[{date:'昨天',time:'20:05',by:'Tina',done:true,detail:'12 次 · 30 分'},{date:'前天',time:'20:00',by:'Tina',done:true,detail:'10 次'},{date:'大前天',by:'Tina',miss:true}]},
    {id:'r2',name:'遛狗',domain:'home',icon:'🐕',risk:'中',schedule:['07:30','12:30','18:30'],rotation:['妈妈','Tina','于棣'],
     fields:[{key:'dur',label:'时长',type:'num',unit:'分钟',def:30},{key:'route',label:'路线',type:'loc',ph:'粘贴 Google 路线链接'}],
     source:'',handoff:'灰灰中午没排便，晚上这趟多走会儿。',records:[{date:'今天',time:'07:35',by:'妈妈',done:true,detail:'河边 · 30 分'}]},
    {id:'r3',name:'HVAC 滤芯',domain:'home',icon:'🏠',risk:'低',cycle:'每季度',schedule:[],rotation:[],
     fields:[{key:'cost',label:'费用',type:'money'},{key:'photo',label:'照片（收据）',type:'photo'},{key:'file',label:'保修单 PDF',type:'file'},{key:'note',label:'备注',type:'text',ph:'型号 / 保修'}],
     source:'',records:[{date:'上季度',by:'',done:true,detail:'$28 · MERV11'}],due:'还有 8 天'}
  ],
  items:[
    {id:'i1',kind:'task',title:'约移民律师',domain:'grow',time:'09:00',who:'于棣',from:'⑤三年回国',done:false},
    {id:'i2',kind:'task',title:'约维修工修洗碗机',domain:'home',time:'14:00',who:'于棣',hard:'最晚周五(保修到期)',est:'30分',done:false},
    {id:'i3',kind:'task',title:'买婴儿床垫',domain:'baby',time:'',who:'Tina',by:'于棣',deleg:'待接受',box:false,wait:'',done:false},
    {id:'i4',kind:'task',title:'买空气净化器',domain:'baby',budget:'$200',who:'待安排',box:true,done:false}
  ],
  plans:[
    {id:'p1',title:'三年回国',domain:'grow',target:'2029 Q2',link:'孕育之外·成长专题',collId:'c1',
     ms:[{n:'确定签证类别(EB-1/NIW)',s:'done',d:'已达成 2026-06'},{n:'备齐推荐信+材料',s:'now',d:'目标 2026-12',hang:'挂 ③每周整理'},{n:'递交申请',s:'todo',d:'目标 2027 Q2',hang:'倒排「约律师」1月初'},{n:'面签',s:'todo',d:'目标 2028'},{n:'搬家+落户',s:'todo',d:'目标 2029 Q2'}]},
    {id:'p2',title:'迎接宝宝',domain:'baby',target:'预产期 2026-10',link:'',collId:'c2',
     ms:[{n:'确认预产期',s:'done',d:'已达成'},{n:'备齐待产包',s:'now',d:'目标 9 月',hang:'倒排 待产清单'},{n:'布置婴儿房',s:'todo',d:'目标 9 月中'},{n:'迎接于摆摆',s:'todo',d:'预产期 2026-10'}]}
  ],
  colls:[
    {id:'c1',icon:'🌏',title:'三年回国规划',domain:'grow',sub:'连里程碑',planId:'p1'},
    {id:'c2',icon:'🍼',title:'孕育知识',domain:'baby',sub:'按孕周推'},
    {id:'c3',icon:'💧',title:'护肤体系',domain:'grow',sub:'Tina'}
  ],
  know:[
    {id:'k1',title:'孕晚期每天固定时间数胎动',point:'异常及时就医',domain:'baby',important:true,collId:'c2',src:'ChatGPT'},
    {id:'k2',title:'麻省 529 供款年底前存',point:'可抵州税，别错节点',domain:'fin',important:true,src:'ChatGPT'},
    {id:'k3',title:'孕期停用 A 醇/视黄醇',point:'改温和保湿、物理防晒',domain:'grow',important:false,collId:'c3',src:'ChatGPT'},
    {id:'k4',title:'新生儿黄疸观察要点',point:'出生后留意肤色/精神',domain:'baby',important:true,collId:'c2',src:'ChatGPT'}
  ],
  refls:[
    {id:'f1',text:'晚睡 → 白天情绪差',note:'连着几天 1 点后睡，效率差、情绪也差。',count:3,arch:false,author:'于棣'},
    {id:'f2',text:'刷手机冷落 Tina',note:'她累的时候我在刷手机、语气冲。下次先放下手机。',count:2,arch:false,author:'于棣'},
    {id:'f3',text:'早起焦虑',note:'',count:0,arch:true,author:'Tina'}
  ],
  jrnls:[
    {id:'j1',title:'于摆摆第一次胎动',text:'晚上躺着感到轻轻一下，超奇妙。',domain:'baby',date:'7-20',author:'Tina'},
    {id:'j2',title:'缅因周末',text:'海边民宿，狗玩疯了。',domain:'home',date:'7-13',author:'于棣'}
  ],
  captures:[],
  checks:{}  /* routineId+date -> true (今天是否已打卡) */
};}
var DB;
function load(){try{DB=JSON.parse(localStorage.getItem(KEY));if(!DB||!DB.routines)DB=seed();}catch(e){DB=seed();}
  if(DB.facts&&!DB.facts.me)DB.facts.me='Tina';}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function uid(){return 'x'+Math.random().toString(36).slice(2,8);}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id==id)return arr[i];return null;}

/* ============================ 状态 / 路由 ============================ */
var state={view:'today',detail:null};
function go(v,d){state.view=v;state.detail=d||null;window.scrollTo(0,0);render();}
function tabget(name){return (['今日','日历','领域','搜索','我'].indexOf(name));}

/* ============================ 日期 ============================ */
function todayStr(){var d=new Date();var wd=['日','一','二','三','四','五','六'][d.getDay()];return '周'+wd+' · '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日';}
function greet(){var h=new Date().getHours();return h<5?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好';}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function tmin(t){if(!t)return 99999;var m=(''+t).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):50000;}
function dkey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

/* ============================ 今日 feed ============================ */
function todayItems(){
  var list=[];
  // ③ routines with a scheduled time today (未打卡的下一次)
  DB.routines.forEach(function(r){
    if(!r.schedule||!r.schedule.length)return;
    var doneToday=DB.checks[r.id+'|'+dkey()];
    // next slot
    var n=nowMin(),slot=r.schedule[0];
    for(var i=0;i<r.schedule.length;i++){if(tmin(r.schedule[i])>=n){slot=r.schedule[i];break;}}
    list.push({rt:'checkin',rid:r.id,title:r.name,domain:r.domain,time:slot,who:r.rotation&&r.rotation.length?r.rotation[(new Date().getDay()+6)%7 % r.rotation.length]:'',risk:r.risk,done:!!doneToday});
  });
  // ④ tasks (not box)
  DB.items.forEach(function(it){if(it.box)return;list.push({rt:'task',id:it.id,title:it.title,domain:it.domain,time:it.time,who:it.who||'',by:it.by,deleg:it.deleg,from:it.from,done:it.done});});
  list.sort(function(a,b){return tmin(a.time)-tmin(b.time);});
  return list;
}
function boxItems(){return DB.items.filter(function(it){return it.box;});}

  return out;
}

function parseCapture(){
  var t=(document.getElementById('cap').value||'').trim();if(!t)return;
  var r=aiParse(t);

  if(r.ask){draft={ask:true,raw:t,answer:r.answer};render();return;}
  draft=r;render();
}
function aiParse(t){
  // 问 / 存 fork
  if(/[？?]$|吗$|几次|多少|什么时候|怎么|是不是/.test(t)&&!/提醒|买|约|记/.test(t)){
    return {ask:true,answer:'📅 查了日历+孕育知识：本周 1 次产检 · 周四 10:00 三维彩超。'};}
  var dom='home',kind='task',fields=[],conf=64,name=t;
  if(/胎动|喂奶|产检|宝宝|孕|婴儿|摆摆/.test(t))dom='baby';
  else if(/理财|存款|预算|报税|529|账|钱/.test(t))dom='fin';
  else if(/学习|回国|课|事业|护肤|美妆|youtube/i.test(t))dom='grow';
  else if(/日记|反思|心情|情绪/.test(t))dom='jrnl';
  if(/每天|每周|每晚|每月|提醒我.*(数|遛|喂|吃)|循环|打卡/.test(t)){kind='cycle';conf=92;
    fields=[{k:'节奏',v:(/晚上?8|20:00|每晚/.test(t)?'每天 20:00':'每天')},{k:'值班',v:'Tina',miss:0},{k:'记录',v:'数量/时长'}];}
  else if(/反思|又.*没|下次|应该/.test(t)&&dom=='jrnl'){kind='refl';conf=80;fields=[{k:'类型',v:'反思'},{k:'可见',v:'🔒私密'}];}
  else {kind='task';conf=64;
    var bud=(t.match(/预算\s*\$?(\d+)/)||t.match(/(\d+)\s*块?元?/));
    fields=[{k:'预算',v:bud?'$'+bud[1]:'',miss:!bud},{k:'负责人',v:'',miss:1},{k:'截止',v:'',miss:1}];}
  name=t.replace(/，.*$/,'').replace(/预算.*$/,'').slice(0,18);
  return {ask:false,raw:t,domain:dom,kind:kind,name:name,fields:fields,conf:conf};
}

  var m=DOMAINS[d.domain];var hi=d.conf>=80;

  }else if(d.kind=='refl'){
    DB.refls.unshift({id:uid(),text:d.name,note:d.raw,count:1,arch:false,author:DB.facts.me});
  }else{
    DB.items.push({id:uid(),kind:'task',title:d.name,domain:d.domain,time:box?'':'',who:box?'待安排':'',box:!!box,done:false,budget:(d.fields[0]&&d.fields[0].v)||''});

function domainScreen(k){
  var d=DOMAINS[k];
  var h='<div class="head dom" style="background:'+d.color+'"><div class="back" onclick="go(\'domains\')">‹ 领域</div><div class="hi">'+d.icon+' '+d.name+'</div><div class="date">'+d.sub+'</div></div><main>';
  if(k=='fin'){h+='<div class="empty" style="padding:34px 20px">💰 <b>财务领域 = 积木⑦</b><br>按咱们说好的，⑦ 财务整块 v1 先不做（要先定数据安全）。<br>但它不是孤岛——费用/金额已是共享事实、⑤计划能挂金额目标。</div>';return h+'</main>';}
  if(k=='baby')h+=careBrief();
  var rs=DB.routines.filter(function(r){return r.domain==k;});
  if(rs.length){h+='<div class="sec">③ 周期与轮值</div>';rs.forEach(function(r){h+=routineRow(r);});}
  var its=DB.items.filter(function(i){return i.domain==k;});
  if(its.length){h+='<div class="sec">④ 任务</div>';its.forEach(function(it){h+=taskRow(it);});}
  var ps=DB.plans.filter(function(p){return p.domain==k;});
  if(ps.length){h+='<div class="sec">⑤ 计划</div>';ps.forEach(function(p){h+='<div class="card item" onclick="go(\'plan\',\''+p.id+'\')"><div class="bd"><div class="ttl">🎯 '+p.title+'</div><div class="meta">'+bchip('plan')+'<span>'+doneMs(p)+'/'+p.ms.length+' 里程碑 · '+p.target+'</span></div></div><div class="do ghost">›</div></div>';});}
  var ks=DB.know.filter(function(x){return x.domain==k;});
  if(ks.length){h+='<div class="sec">② 知识 <span class="r" onclick="go(\'knowledge\')">知识库 ›</span></div>';ks.forEach(function(x){h+=kRow(x);});}
  var js=DB.jrnls.filter(function(x){return x.domain==k;});
  if(js.length){h+='<div class="sec">📖 日记</div>';js.forEach(function(x){h+='<div class="card" onclick="openJournal(\''+x.id+'\')"><div class="ttl" style="font-size:13.5px">'+x.title+'</div><div class="meta"><span>'+x.text+'</span><span class="do ghost" style="margin-left:auto;padding:2px 8px">看 ›</span></div></div>';});}
  return h+'</main>';
}
function routineRow(r){return '<div class="card item" onclick="go(\'cycle\',\''+r.id+'\')"><div class="bd"><div class="ttl">'+r.icon+' '+r.name+'</div><div class="meta">'+bchip('checkin')+'<span>'+(r.schedule.length?r.schedule.join('/'):r.cycle||'')+(r.risk=='高'?' · <b style="color:#c04f83">高</b>':'')+'</span></div></div><div class="do ghost">›</div></div>';}
function taskRow(it){return '<div class="card item" onclick="go(\'task\',\''+it.id+'\')"><div class="bd"><div class="ttl'+(it.done?' done':'')+'">'+it.title+'</div><div class="meta">'+bchip('task')+'<span>'+(it.box?'待办箱':(it.time||'待安排'))+(it.who?' · '+it.who:'')+'</span></div></div><div class="do ghost">›</div></div>';}
function kRow(x){return '<div class="card item" onclick="go(\'know\',\''+x.id+'\')"><div class="bd"><div class="ttl" style="font-size:13.5px">'+x.title+'</div><div class="meta">'+(x.important?'<span class="chip" style="background:#fdeede;color:#b26a12">★重要</span>':'')+'<span>'+x.point+'</span></div></div><div class="do ghost">›</div></div>';}
function doneMs(p){return p.ms.filter(function(m){return m.s=='done';}).length;}

/* ============================ 屏幕：③ 详情 ============================ */
function cycleScreen(id){
  var r=find(DB.routines,id);if(!r)return go('today');
  var d=DOMAINS[r.domain];var hasRot=r.rotation&&r.rotation.length;
  var h='<div class="head dom" style="background:'+d.color+'"><div class="back" onclick="go(\'today\')">‹ 返回</div><div class="hi">'+r.icon+' '+r.name+'</div><div class="date">③ '+(hasRot?'循环 · 轮值打卡':'周期 + 录入')+' · '+d.name+'</div></div><main>';
  h+='<div class="card"><div class="drow"><span class="k">节奏</span><span class="v">'+(r.schedule.length?r.schedule.join(' / '):r.cycle||'')+'</span></div>';
  if(hasRot)h+='<div class="drow"><span class="k">今天值班</span><span class="v">'+r.rotation[(new Date().getDay()+6)%7 % r.rotation.length]+'</span></div>';
  h+='<div class="drow"><span class="k">记录字段</span><span class="v">'+r.fields.map(function(f){return f.label;}).join(' / ')+'</span></div>';
  if(r.risk)h+='<div class="drow"><span class="k">风险</span><span class="v">'+r.risk+(r.risk=='高'?'（漏了立即升级）':'')+'</span></div>';
  if(r.source)h+='<div class="drow"><span class="k">来源</span><span class="v">'+r.source+'</span></div>';
  h+='</div>';
  if(hasRot){var wk='';var di=(new Date().getDay()+6)%7;for(var i=0;i<7;i++){var who=r.rotation[i%r.rotation.length];var t2=i==di;wk+='<div style="flex:1;text-align:center;background:'+(t2?d.color:'#f4f6fa')+';color:'+(t2?'#fff':'var(--text)')+';border-radius:10px;padding:8px 2px;font-size:11px;font-weight:700">'+['一','二','三','四','五','六','日'][i]+'<br>'+(who==DB.facts.me?'你':who)+'</div>';}
    h+='<div class="sec">本周轮值 <span class="r" onclick="toast(\'换班：demo，可选某天改人\',function(){})">换班</span></div><div style="display:flex;gap:5px;margin-bottom:10px">'+wk+'</div>';}
  if(r.handoff)h+='<div class="near">🔁 交接给下一班：'+r.handoff+'</div>';
  h+='<button class="fullbtn" onclick="openCheckin(\''+r.id+'\')">✓ '+(hasRot?'今天打卡':'完成并录入')+'</button>';
  h+='<div class="sec">记录 · 连做 '+r.records.filter(function(x){return x.done;}).length+' 次</div>';
  if(!r.records.length)h+='<div class="empty">还没有记录，点上面打卡。</div>';
  r.records.forEach(function(rec){h+='<div class="rec"><span class="rk">'+(rec.date||'')+(rec.time?' '+rec.time:'')+(rec.by?' · '+rec.by:'')+'</span>'+(rec.miss?'<span class="rmiss">漏 · 已升级</span>':'<span class="rok">✓ '+(rec.detail||'已打卡')+'</span>')+'</div>';});
  return h+'</main>';
}
var cform={};
function openCheckin(id){
  var r=find(DB.routines,id);if(!r)return;cform={_rid:id};
  var h='<h3>'+r.name+'打卡</h3><div class="hint">字段来自「'+r.name+'模板」——换事务字段自动变。</div>';
  if(r.rotation&&r.rotation.length){cform.who=r.rotation[0];
    h+='<div class="field"><label>谁做的</label><div class="seg" id="seg_who">'+r.rotation.map(function(o,i){return '<button class="'+(i==0?'sel':'')+'" onclick="pickWho(this,\''+o+'\')">'+o+'</button>';}).join('')+'</div></div>';}
  r.fields.forEach(function(f){
    if(f.type=='num'){cform[f.key]=f.def;
      h+='<div class="field"><label>'+f.label+'</label><input type="number" inputmode="decimal" value="'+f.def+'" oninput="cform[\''+f.key+'\']=this.value"> <span style="font-size:12px;color:var(--muted)">'+(f.unit||'')+'</span></div>';
    }else if(f.type=='money'){cform[f.key]='';
      h+='<div class="field"><label>'+f.label+'</label><div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;font-weight:700">$</span><input style="flex:1" type="number" inputmode="decimal" placeholder="0.00" oninput="cform[\''+f.key+'\']=this.value"></div></div>';
    }else if(f.type=='loc'){cform[f.key]='';
      h+='<div class="field"><label>'+f.label+'</label><input placeholder="'+(f.ph||'粘贴 Google 地图/路线链接')+'" oninput="cform[\''+f.key+'\']=this.value"><div style="font-size:11px;color:var(--muted);margin-top:5px">📍 贴 Google 链接，保存后渲染地图（位置/路线类型）</div></div>';
    }else if(f.type=='photo'){cform[f.key]='📷 照片';
      h+='<div class="field"><label>'+f.label+'</label><label style="display:block;border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center;color:var(--muted)">＋ 拍照 / 相册上传<input type="file" accept="image/*" hidden></label></div>';
    }else if(f.type=='file'){cform[f.key]='📄 文件';
      h+='<div class="field"><label>'+f.label+'</label><label style="display:block;border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center;color:var(--muted)">＋ 上传 PDF / 保修单<input type="file" hidden></label></div>';
    }else{cform[f.key]='';
      h+='<div class="field"><label>'+f.label+'</label><input placeholder="'+(f.ph||'')+'" oninput="cform[\''+f.key+'\']=this.value"></div>';}
  });
  h+='<button class="fullbtn" onclick="saveCheckin()">保存打卡</button>';
  openSheet(h);
}
function pickWho(el,v){cform.who=v;[].forEach.call(el.parentNode.children,function(b){b.className='';});el.className='sel';}
function saveCheckin(){
  var r=find(DB.routines,cform._rid);var d=new Date();var time=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  var detail=r.fields.map(function(f){var v=cform[f.key];return (v!==''&&v!=null)?v+(f.unit||''):'';}).filter(Boolean).join(' · ');
  r.records.unshift({date:'今天',time:time,by:cform.who||(r.rotation[0]||''),done:true,detail:detail});
  DB.checks[r.id+'|'+dkey()]=true;save();closeSheet();
  toast('✓ 已打卡，写入'+r.name+'日志',function(){});go('cycle',r.id);
}

function taskScreen(id){
  var it=find(DB.items,id);if(!it)return go('today');
  var d=DOMAINS[it.domain];
  var h='<div class="head dom" style="background:'+d.color+'"><div class="back" onclick="go(\'today\')">‹ 返回</div><div class="hi">'+it.title+'</div><div class="date">④ 一次性任务 · '+d.name+'</div></div><main>';
  h+='<div class="card">'+bchip('task')+chip(it.domain)+(it.done?' <span class="chip" style="background:#e7f5ee;color:#2f8f6b">已完成</span>':it.deleg?' <span class="chip" style="background:#fdf3e6;color:#b26a12">'+it.deleg+'</span>':'')+
    '<div class="bigt">'+it.title+'</div>'+
    '<div class="drow"><span class="k">承诺时间</span><span class="v">'+(it.time||'待安排')+'</span></div>'+
    '<div class="drow"><span class="k">负责人</span><span class="v">'+(it.who||'—')+'</span></div>'+
    (it.est?'<div class="drow"><span class="k">AI 估时</span><span class="v">'+it.est+'</span></div>':'')+
    (it.budget?'<div class="drow"><span class="k">预算</span><span class="v">'+it.budget+'</span></div>':'')+
    (it.from?'<div class="drow"><span class="k">来自</span><span class="v">'+it.from+'</span></div>':'')+
    (it.hard?'<div class="drow"><span class="k">硬截止</span><span class="v" style="color:#b26a12">'+it.hard+'</span></div>':'')+'</div>';
  if(it.deleg){var mine=it.who==DB.facts.me;
    h+='<div class="card" style="border-color:#f2d9b8"><div style="font-size:13px;font-weight:800;color:#b26a12;margin-bottom:8px">🔀 '+(mine?(it.by||'于棣')+' 委派给你 · 待你确认':'委派中 · 待 '+it.who+' 确认')+'</div><div class="meta" style="line-height:1.6">'+(mine?'别人派给你的活，你接受了才算你的正式承诺；也可以反提时间。':'跨成员要对方接受才算正式承诺；反提会出冲突决策卡。')+'定夺前不自动改任何日程。</div><div class="acts"><button class="pri" onclick="acceptDeleg(\''+it.id+'\')">'+(mine?'✓ 我接受':'对方接受')+'</button><button onclick="reproposeTask(\''+it.id+'\')">反提时间</button></div></div>';}
  if(it.conflict){h+='<div class="card" style="border-color:#f2d9b8"><div style="font-size:13px;font-weight:800;color:#b26a12;margin-bottom:8px">🔀 冲突决策卡</div><div class="meta" style="line-height:1.7">反提：<b>'+it.conflict.old+' → '+it.conflict.neu+'</b>（'+it.conflict.reason+'）<br>连锁影响：无其它任务 / 另一人日程受影响</div><div class="acts"><button class="pri" onclick="acceptConflict(\''+it.id+'\')">接受 '+it.conflict.neu+'</button><button onclick="go(\'today\')">再想想</button></div><div class="meta" style="text-align:center;margin-top:8px">定夺前不自动改任何正式日程</div></div>';}
  if(!it.done)h+='<div class="acts"><button class="pri" onclick="completeTask(\''+it.id+'\')">✓ 完成</button><button onclick="openReschedule(\''+it.id+'\')">改期</button><button onclick="cancelTask(\''+it.id+'\')">取消</button></div>';
  return h+'</main>';
}
function completeTask(id){var it=find(DB.items,id);if(!it)return;it.done=true;save();toast('✓ 已完成：'+it.title,function(){it.done=false;save();});render();}
function cancelTask(id){DB.items=DB.items.filter(function(x){return x.id!=id;});save();toast('已取消',function(){});go(state.view=='task'?'today':state.view);}
function acceptDeleg(id){var it=find(DB.items,id);it.deleg='';save();toast('✓ '+(it.who==DB.facts.me?'你已接受，成你的正式承诺':it.who+' 已接受'),function(){});go('task',id);}
function reproposeTask(id){var it=find(DB.items,id);it.conflict={old:it.time||'周四',neu:'周六',reason:(it.who==DB.facts.me?'你':it.who)+'那天有产检'};save();toast('🔀 已反提 → 生成冲突决策卡',function(){});go('task',id);}
function acceptConflict(id){var it=find(DB.items,id);it.time=it.conflict.neu;it.conflict=null;it.deleg='';save();toast('✓ 定了新时间：'+it.time,function(){});go('task',id);}
function switchMe(){var m=DB.facts.members;var i=(m.indexOf(DB.facts.me)+1)%m.length;DB.facts.me=m[i];save();toast('已切换身份：'+DB.facts.me,function(){});render();}
function upgradeToCycle(name,dom){DB.routines.push({id:uid(),name:name,domain:dom,icon:DOMAINS[dom].icon,risk:'中',schedule:['18:00'],rotation:[DB.facts.me],fields:[{key:'note',label:'备注',type:'text'}],source:'④→③升级',records:[]});save();toast('⤴ 已升级成 ③循环：'+name,function(){});go('today');}
function reflToAction(id){var r=find(DB.refls,id);DB.items.push({id:uid(),kind:'task',title:'改正：'+r.text.slice(0,10),domain:'grow',time:'',who:DB.facts.me,box:true,done:false,from:'⑥反思'});save();toast('→ 已转成 ④改正行动 · 待办箱',function(){});go('review');}
function applyImpact(){var p=find(DB.plans,'p1');var m=p.ms.filter(function(x){return x.n.indexOf('递交')>=0;})[0];if(m){m.d='目标 2027-03（提前 · 产前备齐）';m.hang='';}DB.facts.dueChanged=null;save();toast('✓ 已用 AI 新排',function(){});render();}
function clearImpact(){DB.facts.dueChanged=null;save();toast('保留原计划',function(){});render();}
/* 需要处理 · 权威工作队列 */
function needItems(){var out=[];DB.items.forEach(function(it){if(it.done)return;if(it.conflict)out.push({t:'冲突待定',it:it,g:"go('task','"+it.id+"')"});else if(it.deleg&&it.who==DB.facts.me)out.push({t:'待你接受',it:it,g:"go('task','"+it.id+"')"});else if(it.box)out.push({t:'待定时间',it:it,g:"go('review')"});});return out;}
function inboxScreen(){var need=needItems();
  var h='<div class="head"><div class="back" onclick="go(\'today\')">‹ 今日</div><div class="hi">需要处理</div><div class="date">权威工作队列 · 待接受 / 冲突 / 待定时间 / 待分类</div></div><main>';
  if(!need.length)h+='<div class="empty">👏 没有待处理的，清爽。</div>';
  need.forEach(function(n){var it=n.it;h+='<div class="card item" onclick="'+n.g+'"><div class="bd"><div class="ttl">'+it.title+'</div><div class="meta"><span class="chip" style="background:#fdeede;color:#b26a12">'+n.t+'</span>'+chip(it.domain)+'<span>'+(it.who||'')+'</span></div></div><div class="do ghost">›</div></div>';});
  var boxK=DB.captures.filter(function(c){return false;});
  h+='<div class="near">🔔 这里是"要干的/要定的"的<b>唯一权威队列</b>——Today 只是聚合冒头，处理都回到源对象。</div>';
  return h+'</main>';
}
function careWeeks(){try{var due=new Date(DB.facts.dueDate);var now=new Date();var days=Math.round((due-now)/86400000);var w=40-Math.ceil(days/7);return Math.max(1,Math.min(42,w));}catch(e){return 32;}}

  var tips=[{g:'需行动',c:'#b26a12',bg:'#fdeede',t:'每天固定时间数胎动',s:'孕晚期 · 异常及时就医',src:'知识「孕晚期数胎动」'},{g:'提醒',c:'#2f6bc4',bg:'#e7effe',t:'本周四 10:00 产检（三维彩超）',s:'麻省总院 · 空腹先喝水',src:'日历'},{g:'仅了解',c:'#6d8579',bg:'#eef3f0',t:'开始留意新生儿黄疸观察要点',s:'出生后用得上',src:'知识库'}];
  var h='<div class="card" style="border-left:3px solid '+DOMAINS.baby.color+'"><div style="font-size:13.5px;font-weight:800;color:'+DOMAINS.baby.color+'">🍼 今日照护简报 · 孕 '+w+' 周</div><div class="meta" style="margin:4px 0 6px">按阶段 + 已批准知识生成 · 分级 · 每条标来源</div>';
  tips.forEach(function(t){h+='<div style="padding:9px 0;border-top:1px solid var(--line)"><span class="chip" style="background:'+t.bg+';color:'+t.c+'">'+t.g+'</span> <b style="font-size:13px">'+t.t+'</b><div class="meta">'+t.s+' · 来源 '+t.src+'</div></div>';});
  return h+'<div class="meta" style="margin-top:8px">医疗建议标来源+适用范围，需你确认，不自动改用药/检查计划。</div></div>';
}
function capMode(m){if(m=='sort')return go('sort');if(m=='photo')return toast('📷 拍照录入（拍收据/物品）· 一键入口 demo',function(){});var el=document.getElementById('cap');if(el)el.focus();}
function openJournal(id){var j=find(DB.jrnls,id);if(!j)return;openSheet('<h3>'+j.title+'</h3><div class="hint">'+DOMAINS[j.domain].name+' · 作者 '+(j.author||'')+' · 🔒 私密</div><div style="font-size:14px;line-height:1.75;margin-bottom:18px">'+j.text+'</div><button class="fullbtn" onclick="closeSheet()">关闭</button>');}

function planScreen(id){
  var p=find(DB.plans,id);if(!p)return go('today');
  var d=DOMAINS[p.domain];var done=doneMs(p),pct=Math.round(done/p.ms.length*100);
  var h='<div class="head dom" style="background:'+d.color+'"><div class="back" onclick="go(\'today\')">‹ 返回</div><div class="hi">🎯 '+p.title+'</div><div class="date">⑤ 计划 · 路线图 · '+d.name+'</div></div><main>';
  if(id=='p1'&&DB.facts.dueChanged){h+='<div class="card" style="border-color:#f2d9b8"><div style="font-size:13px;font-weight:800;color:#b26a12;margin-bottom:8px">🔀 影响分析（预产期 '+DB.facts.dueChanged.old.slice(0,7)+' → '+DB.facts.dueChanged.neu.slice(0,7)+' · 撞「递交申请」窗口）</div><div class="meta" style="line-height:1.7">受影响里程碑：<b>递交申请</b>（与产期撞）· <b>搬家+落户</b>（顺延）<br>受影响任务：3 个需重排 · 不受影响：签证类别、面签</div><div class="acts"><button class="pri" onclick="applyImpact()">用 AI 新排</button><button onclick="clearImpact()">保留原计划</button></div><div class="meta" style="text-align:center;margin-top:8px">AI 只发现+算+摆新旧，不自动改</div></div>';}
  h+='<div class="card">'+(p.collId?'<span class="chip" style="background:#f3ecfb;color:#7a52c9;cursor:pointer" onclick="go(\'knowledge\')">🔗 连 ②专题</span>':'')+
    '<div class="prog"><i style="width:'+pct+'%"></i></div><div class="progl"><span>里程碑 '+done+' / '+p.ms.length+' 达成</span><span>目标 '+p.target+'</span></div></div>';
  h+='<div class="sec">里程碑（近细远粗 · 边走边补）</div>';
  p.ms.forEach(function(m,i){h+='<div class="ms '+m.s+'"><div class="md"></div><div class="mn">'+m.n+'</div><div class="mm">'+(m.s=='done'?'✓ ':'')+m.d+(m.hang?' <span class="hang">'+m.hang+'</span>':'')+'</div></div>';});
  // 倒排该动手日
  var back=p.ms.filter(function(m){return m.hang&&m.hang.indexOf('倒排')>=0;})[0];

/* ============================ 屏幕：⑥ 日记 ============================ */
function journalScreen(){
  var h='<div class="head dom" style="background:#8a4f83"><div class="back" onclick="go(\'domains\')">‹ 领域</div><div class="hi">日记与反思</div><div class="date">反思反复复盘 · 日记只存搜 · 都 🔒私密</div></div><main>';
  h+='<div class="sec">🪞 反思 · 反复到改好</div>';
  var act=DB.refls.filter(function(r){return !r.arch;});
  if(!act.length)h+='<div class="empty">没有在复盘的反思。</div>';
  act.forEach(function(r){h+='<div class="refl"><div class="rt">'+r.text+'</div><div class="rx">'+(r.note||'')+'</div><div class="meta">'+bchip('refl')+'<span>作者 '+(r.author||'')+' · 连 '+r.count+' 次冒出</span></div><div class="acts"><button onclick="speak(\''+r.id+'\')">🔊 念</button><button onclick="reflToAction(\''+r.id+'\')">→ 转行动</button><button class="pri" onclick="archRefl(\''+r.id+'\')">改好了·划掉</button></div></div>';});

  h+='<div class="sec">📖 普通日记 · 只存 + 搜</div>';

  DB.jrnls.forEach(function(x){h+='<div class="card" onclick="openJournal(\''+x.id+'\')"><div class="ttl" style="font-size:13.5px">'+x.title+'</div><div class="meta">'+chip(x.domain)+'<span>作者 '+(x.author||'')+'</span><span class="chip">🔒</span><span class="do ghost" style="margin-left:auto;padding:2px 8px">看 ›</span></div></div>';});
  return h+'</main>';
}
function archRefl(id){var r=find(DB.refls,id);r.arch=true;save();toast('✅ 已划掉、归档——不再冒',function(){r.arch=false;save();});render();}
function speak(id){var r=find(DB.refls,id);try{var u=new SpeechSynthesisUtterance(r.text+'。'+(r.note||''));u.lang='zh-CN';speechSynthesis.speak(u);}catch(e){}toast('🔊 念给你听（hands-free 复盘）',function(){});}
function addJournal(){var t=(document.getElementById('jin').value||'').trim();if(!t)return;DB.jrnls.unshift({id:uid(),title:t.slice(0,14),text:t,domain:'jrnl',date:'今天',author:DB.facts.me});save();toast('✓ 日记已存',function(){});render();}

/* ============================ 屏幕：日历 ============================ */
function calendarScreen(){
  var d=new Date(),y=d.getFullYear(),mo=d.getMonth(),today=d.getDate();
  var first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate();
  var h='<div class="head"><div class="hi">日历</div><div class="date">'+y+' 年 '+(mo+1)+' 月 · 按领域配色</div></div><main>';
  h+='<div class="card"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center">';
  ['日','一','二','三','四','五','六'].forEach(function(w){h+='<div style="font-size:10px;color:var(--muted);font-weight:700">'+w+'</div>';});
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var dd=1;dd<=days;dd++){var t=dd==today;h+='<div style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;'+(t?'background:var(--btn);color:#fff':'color:var(--text)')+'">'+dd+'</div>';}
  h+='</div></div>';
  h+='<div class="sec">今天 · '+todayStr()+'</div>';
  var items=todayItems();
  if(!items.length)h+='<div class="empty">今天没有日程。</div>';
  items.forEach(function(x){var d2=DOMAINS[x.domain];var tgt=x.rt=='checkin'?"go('cycle','"+x.rid+"')":"go('task','"+x.id+"')";h+='<div class="card item" onclick="'+tgt+'"><div style="width:4px;height:32px;border-radius:3px;background:'+d2.color+';flex:none"></div><div class="bd" style="margin-left:10px"><div class="ttl" style="font-size:14px">'+x.title+'</div><div class="meta">'+(x.rt=='checkin'?bchip('checkin'):bchip('task'))+chip(x.domain)+'</div></div><div class="tm">'+(x.time||'—')+'</div></div>';});
  return h+'</main>';
}

/* ============================ 屏幕：搜索 ============================ */
function searchScreen(){
  var q=window._q||'';
  var h='<div class="head"><div class="hi">搜索</div><div class="date">跨所有块 · 一处搜到</div></div><main>';
  h+='<div class="compose" style="padding:10px 13px"><div class="mic" style="width:34px;height:34px;font-size:15px">🔍</div><input id="q" value="'+q+'" placeholder="搜任务/知识/计划/反思/日记…" style="flex:1;border:0;font-size:14px;background:none" oninput="window._q=this.value;renderSearchResults()"></div>';
  h+='<div id="sres">'+searchResults(q)+'</div>';
  return h+'</main>';
}
function renderSearchResults(){var el=document.getElementById('sres');if(el)el.innerHTML=searchResults(window._q||'');}
function searchResults(q){
  if(!q)return '<div class="empty">输入关键词，跨 ③④⑤②⑥ 一起搜。</div>';
  q=q.toLowerCase();var h='',hit=0;
  function m(s){return (s||'').toLowerCase().indexOf(q)>=0;}
  var t1=DB.plans.filter(function(p){return m(p.title);});if(t1.length){h+='<div class="sec">⑤ 计划</div>';t1.forEach(function(p){hit++;h+='<div class="card item" onclick="go(\'plan\',\''+p.id+'\')"><div class="bd"><div class="ttl">🎯 '+p.title+'</div><div class="meta">'+doneMs(p)+'/'+p.ms.length+' 里程碑</div></div></div>';});}
  var t2=DB.know.filter(function(x){return m(x.title)||m(x.point);});if(t2.length){h+='<div class="sec">② 知识</div>';t2.forEach(function(x){hit++;h+=kRow(x);});}
  var t3=DB.items.filter(function(x){return m(x.title);});if(t3.length){h+='<div class="sec">④ 任务</div>';t3.forEach(function(x){hit++;h+=taskRow(x);});}
  var t4=DB.routines.filter(function(x){return m(x.name);});if(t4.length){h+='<div class="sec">③ 循环</div>';t4.forEach(function(x){hit++;h+=routineRow(x);});}
  var t5=DB.refls.filter(function(x){return m(x.text)||m(x.note);});if(t5.length){h+='<div class="sec">⑥ 反思</div>';t5.forEach(function(x){hit++;h+='<div class="card" onclick="go(\'journal\')"><div class="ttl" style="font-size:13.5px">🪞 '+x.text+'</div><div class="meta"><span class="chip">🔒私密</span><span class="do ghost" style="margin-left:auto;padding:2px 8px">›</span></div></div>';});}
  var t6=DB.jrnls.filter(function(x){return m(x.title)||m(x.text);});if(t6.length){h+='<div class="sec">📖 日记</div>';t6.forEach(function(x){hit++;h+='<div class="card" onclick="openJournal(\''+x.id+'\')"><div class="ttl" style="font-size:13.5px">'+x.title+'</div><div class="meta"><span>'+x.text+'</span><span class="do ghost" style="margin-left:auto;padding:2px 8px">看 ›</span></div></div>';});}
  return hit?h:'<div class="empty">没搜到「'+q+'」相关的。</div>';
}

function editDue(){var v=prompt('预产期（YYYY-MM-DD）',DB.facts.dueDate);if(!v)return;var old=DB.facts.dueDate;DB.facts.dueDate=v;

  DB.facts.dueChanged={old:old,neu:v};save();toast('✓ 预产期改了 → 跑影响分析',function(){});go('plan','p1');}
function resetAll(){if(confirm('重置为示例数据？你记的会清掉。')){DB=seed();save();toast('已重置',function(){});go('today');}}

/* ============================ 通用 ============================ */
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('mask').classList.add('show');}
function closeSheet(){document.getElementById('mask').classList.remove('show');}
var toastTimer;
function toast(msg,undo){var el=document.getElementById('toast');el.innerHTML=msg+(undo?'<span class="u" onclick="undoAct()">撤销</span>':'');window._undo=undo;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2600);}
function undoAct(){if(window._undo)window._undo();document.getElementById('toast').classList.remove('show');render();}

var SCREENS={today:todayScreen,capture:captureScreen,review:reviewScreen,domains:domainsScreen,domain:domainScreen,cycle:cycleScreen,task:taskScreen,plan:planScreen,knowledge:knowledgeScreen,coll:collScreen,know:knowScreen,sort:sortScreen,journal:journalScreen,calendar:calendarScreen,search:searchScreen,me:meScreen,inbox:inboxScreen};
var NAVMAP={today:0,calendar:1,domains:2,domain:2,search:3,me:4};
function render(){
  var fn=SCREENS[state.view]||todayScreen;
  var body=fn(state.detail);
  var on=NAVMAP[state.view];if(on==null)on=-1;
  var nav='<nav>'+[['today','📅','今日'],['calendar','🗓','日历'],['domains','🗂','领域'],['search','🔍','搜索'],['me','👤','我']].map(function(t,i){return '<div class="'+(i==on?'on':'')+'" onclick="go(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span>'+t[2]+'</div>';}).join('')+'</nav>';
  document.getElementById('app').innerHTML=body;
  var oldnav=document.getElementById('td_nav');if(oldnav)oldnav.remove();
  var nd=document.createElement('div');nd.id='td_nav';nd.innerHTML=nav;document.body.appendChild(nd);
  // journal quick access via domains? add ⑥ entry on 我? Provide FAB always. Journal reachable from domain 日记与反思.
}
load();
var _h=(location.hash||'').slice(1);if(_h&&SCREENS[_h])state.view=_h;
render();
